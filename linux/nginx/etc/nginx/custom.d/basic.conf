include custom.d/security/referrer-policy.conf;
include custom.d/security/x-content-type-options.conf;
include custom.d/security/x-frame-options.conf;
include custom.d/security/strict-transport-security.conf;
include custom.d/security/permissions-policy.conf;
include custom.d/location/security_file_access.conf;
#include custom.d/cross-origin/requests.conf;

# HSTS and Permissions-Policy live here, not per-vhost: every vhost is HTTPS
# via the tunnel, so the commitment is universal. CSP is deliberately NOT
# here -- it is content-type-mapped and a blanket policy breaks app UIs, so
# it stays per-vhost until the per-app pass. Note that rogue.conf does not
# include this file (intentional: it strips headers as a byte-size test).
