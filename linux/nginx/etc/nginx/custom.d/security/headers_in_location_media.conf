# Security headers for media apps, for use INSIDE a location block.
#
# Same purpose as headers_in_location.conf, but uses
# $permissions_policy_media, which permits fullscreen/autoplay/PiP on the
# app's own origin. The standard policy sets fullscreen=(), which breaks
# video players -- that is why piped.conf historically included no headers
# at all rather than the wrong ones.
add_header Referrer-Policy $referrer_policy always;
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy $permissions_policy_media always;
