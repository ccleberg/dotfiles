# Content-Security-Policy for krz.sh itself.
#
# Uses $content_security_policy_krz, which names https://i.krz.sh (the krz-side
# image host) and https://krz.sh (its own absolute asset URLs). Both are `krz`
# surfaces, so this stays identity-clean -- it names no `cleberg` host.
#
# Other krz vhosts should use custom.d/security/content-security-policy.conf
# (the strict neutral one); this variant exists only because krz.sh loads
# cross-origin images and uses absolute self-URLs.
add_header Content-Security-Policy $content_security_policy_krz always;
