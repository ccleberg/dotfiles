# Content-Security-Policy for `cleberg.*` vhosts ONLY.
#
# Uses $content_security_policy_cmc, which names img.cleberg.net.
# DO NOT include this file in a `krz`/`zerolabs` vhost -- it would put the
# real-name domain into a response header on a pseudonymous surface.
# Those vhosts want custom.d/security/content-security-policy.conf, whose
# policy is identity-neutral.
add_header Content-Security-Policy $content_security_policy_cmc always;
