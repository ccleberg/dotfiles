# Content-Security-Policy for apps that ship inline <script>/<style>.
#
# Identity-neutral (names no host), so it is safe on any vhost -- but it allows
# 'unsafe-inline' for scripts and styles, which is exactly what a strict CSP is
# meant to prevent. Prefer custom.d/security/content-security-policy.conf
# wherever the app does not need this.
#
# Used by: office.zerolabs.sh.
add_header Content-Security-Policy $content_security_policy_inline always;
