# Same as headers_in_location.conf but WITHOUT X-Frame-Options.
#
# For locations that set their own X-Frame-Options. Including the standard
# bundle there would emit TWO conflicting X-Frame-Options headers (the shared
# map's DENY plus the vhost's own SAMEORIGIN); browsers treat a conflicting
# pair as invalid or apply the most restrictive, either way not what was meant.
#
# Used by: rss.zerolabs.sh, which needs SAMEORIGIN (FreshRSS frames itself).
add_header Referrer-Policy $referrer_policy always;
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy $permissions_policy always;
