# Re-includable copy of the server-level security headers.
#
# WHY THIS EXISTS -- nginx's add_header does NOT merge across levels.
# A location block containing ANY add_header discards EVERY add_header
# inherited from the server block. So a location that only wants to add
# `Vary: Accept` silently loses the entire security header set.
#
# This bit cleberg.net hard: `location = /` (the homepage), `location /org/`
# and `location ~ ^/(.+)\.html$` each set `add_header Vary`, and therefore
# served NO Referrer-Policy, X-Content-Type-Options, X-Frame-Options, HSTS,
# Permissions-Policy or CSP at all. Confirmed at the origin and end-to-end
# over a real Tor circuit: the onion homepage returned zero security headers.
#
# It was invisible on the clearnet path because Cloudflare adds its own header
# set at the edge, masking the gap -- but Tor visitors reach nginx directly,
# so they got nothing. That is precisely the audience the onion exists for.
#
# Include this in ANY location that sets its own add_header.
# Mirrors custom.d/basic.conf. CSP is NOT here -- it is per-vhost, so include
# the right one alongside this file:
#   cleberg.*        -> custom.d/security/content-security-policy-cmc.conf
#   krz/zerolabs/etc -> custom.d/security/content-security-policy.conf
add_header Referrer-Policy $referrer_policy always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options $x_frame_options always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy $permissions_policy always;
