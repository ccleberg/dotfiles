# Response header maps (see nginx.conf for context).
# Add Cache-Control.
map $sent_http_content_type $cache_control {
  default                           "public, immutable, stale-while-revalidate";

  # No content
  ""                                "no-store";

  # Manifest files
  ~*application/manifest\+json      "public";
  ~*text/cache-manifest             ""; # `no-cache` (*)

  # Assets
  ~*image/svg\+xml                  "public, immutable, stale-while-revalidate";

  # Data interchange
  ~*application/(atom|rdf|rss)\+xml "public, stale-while-revalidate";

  # Documents
  ~*text/html                       "private, must-revalidate";
  ~*text/markdown                   "private, must-revalidate";
  ~*text/calendar                   "private, must-revalidate";

  # Data
  ~*json                            ""; # `no-cache` (*)
  ~*xml                             ""; # `no-cache` (*)
}

# Add X-Frame-Options for HTML documents.
map $sent_http_content_type $x_frame_options {
  ~*text/html DENY;
}

# Add Content-Security-Policy for HTML documents.
#
# TWO POLICIES, DELIBERATELY SEPARATE -- do not merge them.
#
# $content_security_policy      -- identity-neutral. Safe on ANY vhost.
# $content_security_policy_cmc  -- for `cleberg.*` vhosts ONLY. Names
#                                  img.cleberg.net, so serving it on a
#                                  `krz`/`zerolabs` vhost would put the
#                                  real-name domain in a response header.
#
# The previous single map hardcoded `img-src 'self' https://img.cleberg.net`
# and was the only policy available, so any per-app CSP work would have leaked
# the real-name domain onto a pseudonymous vhost by default. Keeping the
# default neutral makes the safe choice the automatic one.
#
# Also fixed here: the old value was a multi-line quoted string containing 8
# literal newlines, which nginx emitted verbatim -- a folded, malformed header
# that clients saw as empty. Policies must be ONE line.
map $sent_http_content_type $content_security_policy {
  ~*text/(html|javascript)|application/pdf|xml "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";
}

# cleberg.* only. Mirrors what the site actually loads, verified by grepping
# the served HTML: <img src> -> img.cleberg.net (151), <script src> ->
# bubbles.town (174), stylesheets -> https://cleberg.net (180, absolute).
#
# `https://cleberg.net` must be allowed explicitly: the HTML uses ABSOLUTE
# stylesheet URLs, so on the .onion (a different origin) they are cross-origin
# and 'self' would block them.
#
# `upgrade-insecure-requests` is deliberately OMITTED: this vhost also serves
# the .onion over plain http, where UIR would upgrade same-origin subresource
# URLs to https and break them. Cloudflare already sets UIR on the clearnet
# path. See the onion self-containment note in the project record.
map $sent_http_content_type $content_security_policy_cmc {
  ~*text/(html|javascript)|application/pdf|xml "default-src 'self'; img-src 'self' https://img.cleberg.net data:; script-src 'self' https://bubbles.town; connect-src 'self' https://bubbles.town; style-src 'self' https://cleberg.net; font-src 'self' https://cleberg.net; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
}

# For apps that ship inline <script>/<style>/style="" and cannot use the strict
# policy. Currently only office.zerolabs.sh (5 files with inline <script>,
# 3 with <style>, 2 with style attributes). Identity-neutral -- no host is
# named, so it is safe on any vhost.
#
# 'unsafe-inline' is a real weakening: it is what strict CSP exists to prevent.
# It is used here only because the alternative is no CSP at all, which is
# strictly worse. The upgrade path is per-file hashes or nonces; that needs
# changes to the app, not to nginx.
map $sent_http_content_type $content_security_policy_inline {
  ~*text/(html|javascript)|application/pdf|xml "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";
}

# --- Proxied third-party apps -------------------------------------------
# These two are shipped REPORT-ONLY (see the *-report-only.conf includes).
# Both are third-party SPAs whose runtime behaviour cannot be exercised from
# the shell -- no browser here -- and a wrong directive fails SILENTLY: video
# stops playing, or every article image disappears, with only a console
# message. Report-Only gives the visibility with zero outage risk. Promote to
# enforcing after checking a real browser console.

# piped.krz.sh. Derived from evidence, not guesswork:
#   - connect-src: BACKEND_HOSTNAME=pipedapi.krz.sh (container env).
#   - img/media-src: the live API returns PROXY_PART=https://pipedproxy.krz.sh
#     (57 refs in a real /streams response).
#   - script-src needs 'unsafe-inline' AND data:  -- index.html carries 4 inline
#     Vite shims, and the first one does `import 'data:text/javascript,...'`.
#   - blob: for media/worker -- HLS/DASH playback builds blob URLs.
# NOTE pipedproxy.kavin.rocks is baked into the JS bundle as a fallback and is
# deliberately NOT allowed: failing closed to the self-hosted proxy is the
# privacy-correct outcome.
map $sent_http_content_type $csp_piped {
  ~*text/(html|javascript)|application/pdf|xml "default-src 'self'; connect-src 'self' https://pipedapi.krz.sh; img-src 'self' https://pipedproxy.krz.sh data: blob:; media-src 'self' https://pipedproxy.krz.sh blob:; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
}

# rss.zerolabs.sh (FreshRSS). Operator-only behind Cloudflare Access, so the
# T5 stake is low; the risk is breakage. An RSS reader renders arbitrary feed
# HTML, so img/media must allow remote hosts or every article image dies.
# That remote fetching is inherent to the app and is controlled by FreshRSS's
# own "load remote images" setting, not by CSP.
map $sent_http_content_type $csp_freshrss {
  ~*text/(html|javascript)|application/pdf|xml "default-src 'self'; img-src 'self' https: data:; media-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https:; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; object-src 'none'";
}

# Permissions-Policy variant for media apps. The shared policy sets
# `fullscreen=()`, which is exactly why piped.conf excludes basic.conf -- it
# would stop videos going fullscreen. This keeps every other restriction and
# permits fullscreen on the app's own origin.
map $sent_http_content_type $permissions_policy_media {
  ~*text/(html|javascript)|application/pdf|xml "accelerometer=(),autoplay=(self),browsing-topics=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(self),fullscreen=(self),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(self),publickey-credentials-get=(),screen-wake-lock=(self),sync-xhr=(self),usb=(),web-share=(),xr-spatial-tracking=()";
}

# Add Permissions-Policy for HTML documents.
map $sent_http_content_type $permissions_policy {
  ~*text/(html|javascript)|application/pdf|xml "accelerometer=(),autoplay=(),browsing-topics=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(),fullscreen=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),screen-wake-lock=(),sync-xhr=(self),usb=(),web-share=(),xr-spatial-tracking=()";
}

# Add Referrer-Policy for HTML documents.
map $sent_http_content_type $referrer_policy {
  ~*text/(css|html|javascript)|application\/pdf|xml "strict-origin-when-cross-origin";
}

# Add Cross-Origin-Policies for HTML documents.
# Cross-Origin-Embedder-Policy
map $sent_http_content_type $coep_policy {
  ~*text/(html|javascript)|application/pdf|xml "require-corp";
}
# Cross-Origin-Opener-Policy
map $sent_http_content_type $coop_policy {
  ~*text/(html|javascript)|application/pdf|xml "same-origin";
}
# Cross-Origin-Resource-Policy
map $sent_http_content_type $corp_policy {
  ~*text/(html|javascript)|application/pdf|xml "same-origin";
}

# Add Access-Control-Allow-Origin.
map $sent_http_content_type $cors {
  # Images
  ~*image/                        "*";

  # Web fonts
  ~*font/                         "*";
  ~*application/vnd.ms-fontobject "*";
  ~*application/x-font-ttf        "*";
  ~*application/font-woff         "*";
  ~*application/x-font-woff       "*";
  ~*application/font-woff2        "*";
}
