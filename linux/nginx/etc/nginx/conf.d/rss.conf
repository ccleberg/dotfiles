upstream freshrss { server 127.0.0.1:8099; keepalive 64; }
server {
	listen 127.0.0.1:10045;
	server_name rss.zerolabs.sh;

	include custom.d/basic.conf;
	location / {
		proxy_pass http://freshrss/;
		# This add_header discarded EVERYTHING from basic.conf -- nginx does
		# not merge add_header across levels. Verified: this vhost was serving
		# X-Frame-Options and nothing else (no Referrer-Policy, no HSTS, no
		# Permissions-Policy, no X-Content-Type-Options). Restored below.
		# SAMEORIGIN (not the shared map's DENY) -- hence the _no_xfo bundle,
		# which omits X-Frame-Options so the two do not conflict.
		add_header X-Frame-Options SAMEORIGIN;
		include custom.d/security/headers_in_location_no_xfo.conf;
		include custom.d/security/content-security-policy-freshrss-report-only.conf;
		proxy_redirect off;
		proxy_buffering off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Port $server_port;
		proxy_read_timeout 90;
		proxy_set_header Authorization $http_authorization;
		proxy_pass_header Authorization;
	}
	include custom.d/security/robots_index_only.conf;
}

