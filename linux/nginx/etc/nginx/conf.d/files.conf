server {
	listen 127.0.0.1:10017;
	# files.cleberg.net was retired 2026-08-03: it and files.krz.sh both routed
	# here, so one origin served byte-identical content under both identities.
	# The real-name hostname was removed; this vhost is krz-only now. Named
	# explicitly rather than left to default-server fallback.
	server_name files.krz.sh;
	add_header Onion-Location "http://yt2y635dc6zyxziy5ytkfz36bmkgcxuccq3meom6qp44gjdat54wt5id.onion$request_uri" always;
	include custom.d/basic.conf;
	root /var/www/files/;
	autoindex on;
	location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 127.0.0.1:10018;
    server_name yt2y635dc6zyxziy5ytkfz36bmkgcxuccq3meom6qp44gjdat54wt5id.onion;
    include custom.d/basic.conf;
    root /var/www/files/;
    autoindex on;
    location / { try_files $uri $uri/ /index.html; }
}

