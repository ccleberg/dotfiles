# zerolabs.sh -> krz.sh  (301, preserves subdomain + path + query)
map $host $krz_target {
    default                        krz.sh;
    "~^(?<sub>.+)\.zerolabs\.sh$"  "$sub.krz.sh";
}

server {
    listen      127.0.0.1:10000;
    server_name zerolabs.sh *.zerolabs.sh;

    # This vhost is a bare redirect and does not include basic.conf, so HSTS
    # is set explicitly -- otherwise the redirect hop is the one response on
    # this domain without it.
    include custom.d/security/strict-transport-security.conf;

    return 301 https://$krz_target$request_uri;
}
