server {
	listen 127.0.0.1:10048;
	server_name i.krz.sh;
	add_header Onion-Location "http://j42zbkbxrdx4mvkyutt7jiwpucgcmrdvaelwcwmgwn3mzus2v6x3toad.onion$request_uri" always;
	include custom.d/basic.conf;
	include custom.d/security/content-security-policy.conf;
	root /var/www/i/;
