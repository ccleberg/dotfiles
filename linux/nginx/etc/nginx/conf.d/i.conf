# Onion counterpart of i.krz.sh. Reached via tor -> 127.0.0.1:10049, so it
# never transits Cloudflare; nginx is the only thing setting headers here.
server {
    listen 127.0.0.1:10049;
    server_name j42zbkbxrdx4mvkyutt7jiwpucgcmrdvaelwcwmgwn3mzus2v6x3toad.onion;
    include custom.d/basic.conf;
    include custom.d/security/content-security-policy.conf;
    root /var/www/i/;
    autoindex on;
    location / { try_files $uri $uri/ =404; }
}
