# Piped frontend -- 127.0.0.1:8077 -> container on :8076
#
# HISTORY: this file used to be a Host-based router for all three Piped
# hostnames, because the Cloudflare tunnel sent pipedapi.krz.sh and
# pipedproxy.krz.sh to :8077 as well, landing them on the frontend and breaking
# every API call. The dashboard was corrected 2026-08-03 to point pipedapi at
# :8078 and pipedproxy at :8079 directly, so those two server blocks became
# dead code and were removed.
#
# Ports: frontend :8076, backend :8078, media proxy :8079.
#
# WHY THE FRONTEND BLOCK STAYS: the tunnel still routes piped.krz.sh here
# (confirmed -- the security headers added below appear on the public
# response), and the Tor onion for piped targets :8077 with a .onion Host
# header, which needs default_server to land somewhere. Routing the frontend
# straight to :8076 would also drop the header/CSP work below.
#
# NOTE: custom.d/basic.conf is deliberately NOT included. Its Permissions-Policy
# sets fullscreen=(), which would stop videos going fullscreen. See
# headers_in_location_media.conf, included in the location, for the variant
# that keeps every other restriction.

# Frontend. default_server so the Tor onion for piped (which targets :8077 with
# a .onion Host header) also lands here.
server {
    listen 127.0.0.1:8077 default_server;
    server_name piped.krz.sh;

    location / {
        proxy_pass http://127.0.0.1:8076;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # This vhost previously served NO security headers at all, because
        # basic.conf was excluded wholesale to avoid its `fullscreen=()`.
        # The media bundle keeps every other restriction and permits
        # fullscreen/autoplay/PiP on this origin, so the player still works.
        include custom.d/security/headers_in_location_media.conf;
        # CSP is REPORT-ONLY -- see content_type_maps.conf. Nothing is blocked.
        include custom.d/security/content-security-policy-piped-report-only.conf;
    }
}
