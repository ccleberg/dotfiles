server {
	listen 127.0.0.1:10011;
	server_name cleberg.net paske4urhs6nttrtlkuwa5cowum3fjkc6yv6kl4ncx3mjxcd77764nqd.onion;

	# No per-vhost error_log: it overrode the global "off" and wrote visitor
	# IPs to disk.

	# basic.conf carries HSTS + Permissions-Policy. CSP stays explicit, and now
	# uses the cmc-specific policy: the shared $content_security_policy was made
	# identity-neutral so it is safe to reach for on a krz vhost by default.
	#
	# NOTE: every `location` below that sets its own add_header must ALSO
	# include these two files, or it discards them (nginx add_header does not
	# merge across levels). See custom.d/security/headers_in_location.conf.
	include custom.d/basic.conf;
	include custom.d/security/content-security-policy-cmc.conf;
	root /var/www/cleberg.net/;
	include custom.d/redirects/blog.conf;
	port_in_redirect off;

	add_header Onion-Location "http://paske4urhs6nttrtlkuwa5cowum3fjkc6yv6kl4ncx3mjxcd77764nqd.onion$request_uri" always;

	# Images live in the img.cleberg.net docroot and are served same-origin here
	# so the .onion is self-contained (see the onion-containment work, 2026-08-03).
	#
	# This is an nginx alias, NOT a filesystem symlink, on purpose. A symlink at
	# /var/www/cleberg.net/img worked but was DESTROYED by the very next deploy:
	# the site deploys with `rsync --delete`, which removes anything in the
	# destination that is not in the source tree. That silently 404'd every image
	# on the site. An alias lives in nginx config, so no deploy can remove it.
	location /img/ {
		alias /var/www/img/;
		# This block sets no add_header of its own, so it inherits the
		# server-level security headers. Do not add one without re-including
		# custom.d/security/headers_in_location.conf -- nginx does not merge.
	}

	location /org/ {
		internal;
		alias /var/www/cleberg.net/org/;
		default_type text/markdown;
		add_header Content-Type "text/markdown; charset=utf-8" always;
		add_header Vary "Accept" always;
		# Restore what this block's own add_header discarded:
		include custom.d/security/headers_in_location.conf;
		include custom.d/security/content-security-policy-cmc.conf;
		add_header Onion-Location "http://paske4urhs6nttrtlkuwa5cowum3fjkc6yv6kl4ncx3mjxcd77764nqd.onion$request_uri" always;
	}

	location = / {
		if ($http_accept ~* "text/markdown") {
			rewrite ^/$ /org/index.org last;
		}

		add_header Vary "Accept" always;
		# Restore what this block's own add_header discarded. Without these the
		# HOMEPAGE served no security headers and no Onion-Location at all.
		include custom.d/security/headers_in_location.conf;
		include custom.d/security/content-security-policy-cmc.conf;
		add_header Onion-Location "http://paske4urhs6nttrtlkuwa5cowum3fjkc6yv6kl4ncx3mjxcd77764nqd.onion$request_uri" always;
		try_files /index.html =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	location /blog/ {
		rewrite ^/blog/((?!index)[^/]+)/(.*)$ /blog/$1.html permanent;
		if ($http_accept ~* "text/markdown") {
			rewrite ^/blog/([^/]+)\.html$ /org/blog/$1.org last;
		}
	}

	location ~ ^/(.+)\.html$ {
		if ($http_accept ~* "text/markdown") {
			rewrite ^/(.+)\.html$ /org/$1.org last;
		}
		add_header Vary "Accept" always;
		# Restore what this block's own add_header discarded. This location
		# serves every article/blog page on the site.
		include custom.d/security/headers_in_location.conf;
		include custom.d/security/content-security-policy-cmc.conf;
		add_header Onion-Location "http://paske4urhs6nttrtlkuwa5cowum3fjkc6yv6kl4ncx3mjxcd77764nqd.onion$request_uri" always;
		try_files $uri =404;
	}
}
