server {
    listen 127.0.0.1:10001;
    server_name rogue.krz.sh;

    root /var/www/rogue;
    index index.html;

    server_tokens off;
    etag off;
    if_modified_since off;
    expires off;
    gzip off;
    gzip_vary off;
    charset off;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }
}

