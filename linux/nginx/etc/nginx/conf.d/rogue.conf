server {
    listen 127.0.0.1:10001;
    server_name rogue.krz.sh;

    root /var/www/rogue/;
    index index.html;
    autoindex on;

    server_tokens off;
    etag off;
    if_modified_since off;
    expires off;
    gzip off;
    gzip_vary off;
    charset off;

    # `/` used to 404: this block did `try_files /index.html =404` and there is
    # no index.html at the webroot, so it short-circuited before `autoindex on`
    # could ever produce a listing. Removed, so `/` now falls through to the
    # server-level `index`/`autoindex` and lists 1kb/ and 1mb/.
    #
    # Deliberately NOT adding basic.conf here: this vhost strips headers on
    # purpose (server_tokens/etag/expires/gzip/charset all off) because it is a
    # byte-size experiment -- a 1 KB CSS-only game. Adding security headers
    # would defeat the point of the vhost.

    location = /index.html {
        try_files /index.html =404;
    }
}

